<title>Aice Demo UI Preview</title>
<meta name="theme-color" content="#1E1A44">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: sticky control bar, then one device frame. Consumer app is phone-first and re-flows by container width; admin is laptop-first with a sidebar. */
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --ink:#1E1A44; --muted:#5A5F7A; --line:#D6E2EE;
  /* BRAND THEME (Aice-like: blue, white, red accent, navy ink). Swap this block to go back to the neutral blue. */
  --pri:#1060A0; --pri-d:#0B4A7C; --pri-ink:#FFFFFF; --tint:#E8F1FA;
  --acc:#E02030; --acc-ink:#FFFFFF; --good:#0C7A43; --good-bg:#E2F5EA;
  --warn-bg:#FFF4D6; --warn-ink:#5B4300; --bad:#B3261E; --bad-bg:#FDE8E6;
  --cold:#0A5C8A; --cold-bg:#DDF0FA; --chrome:#1E1A44; --chrome-ink:#E8EEF8;
  --t1:#FFE1E8; --t2:#E7E1FA; --t3:#FBEBD4; --t4:#E0F1E6; --t5:#DCEBFF;
  --font:'Roboto','Noto Sans SC',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1220; --panel:#121C2E; --ink:#E8EEF8; --muted:#9AA9C2; --line:#25324A;
  --pri:#4FA3E8; --pri-d:#2F7FC2; --pri-ink:#06142B; --tint:#162A40;
  --acc:#FF6B77; --acc-ink:#2B0508; --good:#4BD08A; --good-bg:#10321F;
  --warn-bg:#3A2E10; --warn-ink:#FFE19A; --bad:#FF8A80; --bad-bg:#3B1815;
  --cold:#7CCBF2; --cold-bg:#10303F; --chrome:#050A14; --chrome-ink:#E8EEF8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1220; --panel:#121C2E; --ink:#E8EEF8; --muted:#9AA9C2; --line:#25324A;
  --pri:#4FA3E8; --pri-d:#2F7FC2; --pri-ink:#06142B; --tint:#162A40;
  --acc:#FF6B77; --acc-ink:#2B0508; --good:#4BD08A; --good-bg:#10321F;
  --warn-bg:#3A2E10; --warn-ink:#FFE19A; --bad:#FF8A80; --bad-bg:#3B1815;
  --cold:#7CCBF2; --cold-bg:#10303F; --chrome:#050A14; --chrome-ink:#E8EEF8; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* control bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--chrome);color:var(--chrome-ink);
  padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--chrome)}
.bar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px;margin-right:auto}
.seg{display:inline-flex;border:1px solid #ffffff40;border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--chrome-ink);padding:8px 14px;min-height:40px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);font-weight:700}
.seglabel{font-size:11px;text-transform:uppercase;letter-spacing:.8px;opacity:.7;margin-right:6px}
.group{display:flex;align-items:center}
.note{max-width:1180px;margin:14px auto 0;padding:0 max(16px,env(safe-area-inset-left,0px));color:var(--muted);font-size:13px}
.stage{padding:16px max(16px,env(safe-area-inset-left,0px)) 40px;display:flex;justify-content:center}
.frame{width:var(--w,390px);max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;
  box-shadow:0 18px 50px #0b1b3322;height:min(820px,calc(100vh - 150px));min-height:560px;display:flex;flex-direction:column}
.frame.wide{border-radius:12px}

/* ---------- app shell ---------- */
.app{container-type:inline-size;container-name:app;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);position:relative}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.hdr{background:linear-gradient(160deg,var(--pri),var(--pri-d));color:#fff;padding:14px 16px 16px;border-radius:0 0 22px 22px}
.hdr .top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.hdr .store{font-size:12px;font-weight:700;opacity:.95}
.chipy{background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.hdr .eta{display:flex;gap:10px;align-items:center;margin:12px 0 10px}
.hdr .eta i{width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-style:normal;font-weight:900}
.hdr .eta b{font-size:21px;display:block;line-height:1.1}
.hdr .eta span{font-size:12px;opacity:.85}
.search{display:flex;gap:8px;align-items:center;background:var(--panel);color:var(--muted);border-radius:14px;padding:12px 14px;border:0;width:100%;text-align:left}
.pad{padding:14px 16px}
h2.sec{font-size:16px;margin:0 0 10px;font-weight:800;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2.sec small{font-weight:400;color:var(--muted);font-size:12px}
.welcome{background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.welcome p{margin:0;flex:1 1 200px;font-size:13px}
.btn{background:var(--pri);color:var(--pri-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:700;min-height:44px}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.good{background:var(--good);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:500;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .new{background:var(--acc);color:var(--acc-ink);font-size:10px;font-weight:900;border-radius:6px;padding:1px 5px}
.tile{border-radius:16px;position:relative;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;display:block}
:root[data-theme="dark"] .tile img{mix-blend-mode:multiply}
.rail{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.rec{flex:0 0 auto;scroll-snap-align:start;display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;min-height:64px;text-align:left}
.rec .tile{width:48px;height:48px}
.rec b{display:block;font-size:13px}
.rec span{font-size:12px;color:var(--muted)}
.bundles{display:grid;gap:10px}
.bundle{min-width:0;background:var(--warn-bg);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center}
.bundle .tile{width:76px;height:76px;flex:0 0 auto;background:var(--t3)}
.bundle h3{margin:0;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pct{background:var(--good-bg);color:var(--good);border-radius:6px;padding:1px 6px;font-size:11.5px;font-weight:900}
.bundle p{margin:2px 0 6px;font-size:12px;color:var(--muted)}
.price{font-weight:900;font-size:16px}
.old{text-decoration:line-through;color:var(--muted);font-size:12px;margin-left:6px;font-weight:400}
.save{background:var(--acc);color:var(--acc-ink);border-radius:6px;font-size:11px;font-weight:700;padding:1px 6px;margin-left:6px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.card .tile{aspect-ratio:1/1;border-radius:0}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .nm{font-weight:700;font-size:13.5px;line-height:1.25}
.card .sz{font-size:12px;color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:500;border-radius:6px;padding:2px 6px;background:var(--tint);color:var(--ink);white-space:nowrap}
.tag.cold{background:var(--cold-bg);color:var(--cold)}
.tag.exp{background:var(--warn-bg);color:var(--warn-ink)}
.tag.low{background:var(--bad-bg);color:var(--bad)}
.tag.member{background:var(--tint);color:var(--pri)}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:6px;padding-top:6px}
.add{width:44px;height:44px;border-radius:12px;background:var(--pri);color:var(--pri-ink);border:0;font-size:22px;font-weight:700;flex:0 0 auto}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--panel)}
.stepper button{width:44px;height:44px;border:0;background:transparent;font-size:20px}
.stepper span{min-width:28px;text-align:center;font-weight:700}
.ribbon{position:absolute;left:8px;top:8px;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:700;border-radius:8px;padding:2px 8px;z-index:1}
.disc{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 12px;font-size:13px}

/* bottom nav / side rail */
.nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;min-height:52px;border-radius:14px;color:var(--muted);font-size:12px;position:relative}
.nav button[aria-current="page"]{color:var(--pri);font-weight:700;background:var(--tint)}
.nav svg{width:22px;height:22px}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.foot{padding:16px;font-size:11.5px;color:var(--muted);text-align:center}

/* overlays */
.scrim{position:absolute;inset:0;background:#0b1b3388;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--panel);width:100%;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 8px;font-size:18px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12.5px;font-weight:700}
.field input{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;min-height:46px;font:inherit}
.field small{color:var(--muted);font-size:11.5px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;min-height:42px;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:700}
.demochips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.demochips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:12.5px;min-height:36px}
.link{background:none;border:0;color:var(--pri);text-decoration:underline;padding:8px 0;min-height:36px;font-size:13px}
table.tiers{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
table.tiers td,table.tiers th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.tiers th{font-size:11.5px;color:var(--muted);font-weight:500}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;z-index:12;display:flex;justify-content:space-between;gap:10px;font-size:13px}

/* orders */
.order{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.order header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.pend{background:var(--bad-bg);color:var(--bad)}
.pill.prep{background:var(--warn-bg);color:var(--warn-ink)}
.pill.ship{background:var(--cold-bg);color:var(--cold)}
.pill.done{background:var(--good-bg);color:var(--good)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0 4px}
.steps div{font-size:11px;color:var(--muted);text-align:center}
.steps div::before{content:"";display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:4px}
.steps div.on{color:var(--ink);font-weight:700}
.steps div.on::before{background:var(--pri)}

/* cart */
.cartgrid{display:grid;gap:12px}
.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line .tile{width:56px;height:56px;flex:0 0 auto}
.line .info{flex:1;min-width:0}
.line .info b{display:block;font-size:13.5px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--panel);width:100%;text-align:left;min-height:48px}
.opt[aria-pressed="true"]{border-color:var(--pri);background:var(--tint)}
.opt i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;margin-top:2px}
.opt[aria-pressed="true"] i{border:5px solid var(--pri)}
.opt small{display:block;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* responsive app (by container width, so the preview and a real laptop behave the same) */
.app .shell{display:flex;flex:1;min-height:0;flex-direction:column}
.app .main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.wrapin{width:100%;max-width:1180px;margin:0 auto;min-width:0}
.wrapin.pad>*{min-width:0}
.wrapin.pad[style*="grid"]{grid-template-columns:minmax(0,1fr)}
.rail,.chips{max-width:100%}
@container app (min-width:640px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bundles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pad{padding:18px 24px}
  .hdr{padding:18px 24px 20px}
  .sheet{max-width:560px;border-radius:22px;margin-bottom:auto;margin-top:auto}
  .scrim{align-items:center}
}
@container app (min-width:960px){
  .app .shell{flex-direction:row}
  .nav{order:-1;flex-direction:column;width:200px;border-top:0;border-right:1px solid var(--line);padding:16px 10px;gap:4px;justify-content:flex-start}
  .nav button{flex:0 0 auto;flex-direction:row;gap:12px;justify-content:flex-start;padding:10px 14px;font-size:14px;min-height:48px}
  .badge{position:static;margin-left:auto}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .bundles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cartgrid{grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);align-items:start}
  .hdr{border-radius:0 0 28px 28px}
  .toast{left:auto;right:24px;bottom:24px;width:340px}
}

/* ---------- admin ---------- */
.adm{container-type:inline-size;container-name:adm;flex:1;min-height:0;display:flex;background:var(--bg)}
.adm .side{display:none;width:210px;background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;flex-direction:column;gap:4px;flex:0 0 auto}
.adm .side .brand{font-weight:900;font-size:15px;padding:4px 12px 14px;color:var(--pri)}
.adm .side button,.adm .pillnav button{border:0;background:transparent;text-align:left;padding:10px 14px;border-radius:12px;min-height:44px;font-weight:500;color:var(--muted)}
.adm .side button[aria-current="page"],.adm .pillnav button[aria-current="page"]{background:var(--tint);color:var(--pri);font-weight:700}
.adm .pillnav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
.adm .pillnav button{flex:0 0 auto;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;min-height:40px}
.adm .content{flex:1;min-width:0;display:flex;flex-direction:column}
.adm .body{padding:16px;display:grid;gap:14px}
.ahero{background:linear-gradient(150deg,var(--pri),var(--pri-d));color:#fff;border-radius:18px;padding:18px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.ahero h2{margin:0;font-size:20px}
.ahero p{margin:4px 0 0;font-size:12.5px;opacity:.9;max-width:560px}
.ahero .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ahero .btn{background:#fff;color:#0A3F96}
.ahero select{background:#ffffff26;color:#fff;border:1px solid #ffffff66;border-radius:10px;padding:8px;min-height:40px;font:inherit}
.ahero select option{color:#0B1B33}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi span{font-size:12px;color:var(--muted);display:block}
.kpi b{font-size:21px;font-weight:900;display:block;margin-top:2px;overflow-wrap:break-word}
.kpi.bad b{color:var(--bad)}.kpi.good b{color:var(--good)}
.kpi em{font-style:normal;font-size:11.5px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.panel h3{margin:0 0 2px;font-size:15px}
.panel>p{margin:0 0 10px;font-size:12px;color:var(--muted)}
.two{display:grid;gap:14px}
.ord{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.ord .l b{font-size:13px;display:block}
.ord .l span{font-size:12px;color:var(--muted);display:block;overflow-wrap:anywhere}
.ord .r{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.alarm{display:flex;gap:10px;padding:10px;border-radius:12px;margin-top:8px;align-items:flex-start}
.alarm.p0{background:var(--cold-bg)}.alarm.p1{background:var(--warn-bg)}
.alarm b{font-size:11px;border-radius:6px;padding:2px 6px;background:var(--ink);color:var(--bg);flex:0 0 auto}
.alarm div{font-size:13px;min-width:0}
.alarm small{display:block;color:var(--muted)}
.spark{width:100%;height:110px;display:block}
.spark text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.light{width:100%;border-collapse:collapse;font-size:13px}
.light th,.light td{text-align:left;padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
.light th{font-size:11.5px;color:var(--muted);font-weight:500;border-top:0}
.tablewrap{overflow-x:auto}
@container adm (min-width:760px){
  .kpis{grid-template-columns:repeat(4,1fr)}
  .adm .body{padding:20px 24px}
}
@container adm (min-width:1000px){
  .adm .side{display:flex}
  .adm .pillnav{display:none}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .two{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
}

@media (prefers-reduced-motion:no-preference){.card,.btn,.add{transition:transform .12s}.card:active,.btn:active,.add:active{transform:scale(.97)}}

/* white direction: white surfaces, blue only for actions and accents */
.hdr{background:var(--panel);color:var(--ink);border-radius:0;border-bottom:1px solid var(--line)}
.hdr .eta span{opacity:1;color:var(--muted)}
.hdr .eta i{background:var(--pri);color:#fff}
.hdr .store{color:var(--muted)}
.hdr .search{background:var(--tint);border:1px solid var(--line)}
.ahero{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.ahero p{opacity:1;color:var(--muted)}
.ahero .btn{background:var(--pri);color:var(--pri-ink)}
.ahero select{background:var(--panel);color:var(--ink);border:1.5px solid var(--line)}
.ahero select option{color:#0B1B33}
.frame{box-shadow:0 10px 36px #0b1b3318}
.card,.panel,.kpi,.order{box-shadow:0 1px 2px #0b1b3310}
@container app (min-width:960px){.hdr{border-radius:0}}

/* Tanya AI chat */
.askbtn{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:0;border-radius:14px;padding:0 14px;min-height:46px;background:var(--acc);color:var(--acc-ink);font-weight:700}
.searchrow{display:flex;gap:8px}.searchrow .search{flex:1;min-width:0}
.fab{position:absolute;right:16px;bottom:84px;z-index:8;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:0 18px;min-height:48px;background:var(--acc);color:var(--acc-ink);font-weight:700;box-shadow:0 6px 18px #0b1b3340}
@container app (min-width:960px){.fab{right:24px;bottom:24px}}
.chat{position:absolute;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column}
.chat-top{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.chat-top>div{flex:1;min-width:0}.chat-top small{display:block;color:var(--muted);font-size:11.5px}
.chat-back{width:44px;height:44px;border:0;background:var(--tint);border-radius:12px;font-size:20px;color:var(--pri)}
.chat-msgs{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:86%;border-radius:16px;padding:10px 12px;font-size:14px;white-space:pre-line}
.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--pri);color:var(--pri-ink);border-bottom-right-radius:4px}
.msg .rail{margin-top:8px;flex-direction:column;overflow:visible}
.msg .rec{width:100%}
.chat-chips{display:flex;gap:8px;overflow-x:auto;padding:6px 14px;scrollbar-width:none}
.chat-chips button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;min-height:40px;font-size:13px}
.chat-form{display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel)}
.chat-form input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:0 12px;min-height:46px;font:inherit}
.sr{position:absolute;left:-9999px}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:4px}
@container app (min-width:640px){.chat{inset:16px auto 16px auto;right:16px;width:420px;border-radius:18px;border:1px solid var(--line);box-shadow:0 18px 50px #0b1b3340;overflow:hidden}}

/* guideline fixes + new screens */
@media (hover:hover){.btn:hover{filter:brightness(1.1)}.chip:hover,.card:hover,.rec:hover,.opt:hover,.storeopt:hover,.srow:hover{border-color:var(--pri)}.add:hover{filter:brightness(1.12)}.nav button:hover{background:var(--tint)}}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
h1,h2,h3{text-wrap:balance}
.sheet,.chat-msgs,.screen .sbody,.scroll{overscroll-behavior:contain}
.field input,.chat-form input,.sfield{font-size:16px}
.chat,.screen,.dlg,.sheet{outline:none}
.demo{background:var(--ink);color:var(--bg);font-size:11px;text-align:center;padding:4px 10px;letter-spacing:.2px}
.iconbtn{position:relative;width:44px;height:44px;border-radius:12px;border:0;background:#ffffff00;display:grid;place-items:center;color:var(--ink);flex:0 0 auto}
.iconbtn .badge{top:2px;left:auto;right:2px}
.storebtn{display:flex;align-items:center;gap:6px;border:0;background:var(--tint);color:var(--ink);border-radius:999px;padding:0 12px;min-height:44px;font-weight:700;font-size:13px;min-width:0}
.storebtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptsCard{background:linear-gradient(150deg,var(--pri),var(--pri-d));color:var(--pri-ink);border-radius:18px;padding:14px 16px;display:grid;gap:8px}
.ptsCard .row1{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.ptsCard b.big{font-size:28px;font-weight:900;line-height:1}
.ptsCard .bar2{height:8px;border-radius:4px;background:#ffffff40;overflow:hidden}
.ptsCard .bar2 i{display:block;height:100%;background:var(--pri-ink);border-radius:4px}
.ptsCard .btn{background:var(--pri-ink);color:var(--pri)}
.screen{position:absolute;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column}
.screen .sbody{flex:1;overflow-y:auto;min-height:0}
.dlgscrim{position:absolute;inset:0;background:#0b1b3399;z-index:14;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--panel);border-radius:18px;padding:18px;width:min(100%,420px)}
.dlg h3{margin:0 0 6px}.dlg p{margin:0 0 14px;color:var(--muted)}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn.danger{background:var(--bad);color:#fff}
.srow{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
.srow .tile{width:56px;height:56px;flex:0 0 auto}.srow .info{flex:1;min-width:0}.srow .info b{display:block;font-size:13.5px}
.storeopt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;min-height:56px}
.storeopt[aria-pressed="true"]{border-color:var(--pri);background:var(--tint)}
.storeopt b{display:block}.storeopt small{color:var(--muted)}
.notif{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.notif.unread{border-color:var(--pri)}.notif i{width:10px;height:10px;border-radius:50%;background:var(--line);margin-top:5px;flex:0 0 auto}
.notif.unread i{background:var(--acc)}.notif b{display:block;font-size:13.5px}.notif small{color:var(--muted)}
.tl{margin:10px 0 0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:22px 1fr auto;gap:2px 10px;padding-bottom:14px;position:relative}
.tl li::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--line);margin:4px 0 0 4px;border:2px solid var(--line)}
.tl li.on::before{background:var(--pri);border-color:var(--pri)}
.tl li::after{content:"";position:absolute;left:9px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl small{color:var(--muted);grid-column:2}
.eta{font-variant-numeric:tabular-nums}
.bigeta{background:var(--tint);border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bigeta b{font-size:26px;font-weight:900;color:var(--pri)}
.sfield{width:100%;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px;min-height:46px;font-family:inherit}
.photoph{height:84px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);width:100%;background:transparent}
.photoph.has{border-style:solid;border-color:var(--good);color:var(--good);background:var(--good-bg)}
.btn.small.alt{background:var(--tint);color:var(--pri)}
.adm{position:relative}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.iconbtn .badge{position:absolute!important;top:3px;right:3px;left:auto!important;margin:0!important}
.kpis .kpi:last-child:nth-child(odd){grid-column:span 2}
.toast .link{color:var(--bg);font-weight:700;text-decoration:underline}
@media (max-width:699px){.bar{position:static}}
.tag{white-space:normal}.save{white-space:normal;margin-left:0}.old{margin-left:0}
.pr{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.hero{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:20px}
.hero::-webkit-scrollbar{display:none}
.hslide{flex:0 0 100%;scroll-snap-align:start;color:#fff;border-radius:20px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px;min-height:168px;overflow:hidden}
.htxt{display:flex;flex-direction:column;gap:6px;align-items:flex-start;flex:1;min-width:0}
.htxt b{font-size:21px;line-height:1.15;text-wrap:balance}.htxt span{font-size:13px;opacity:.95}
.htxt .btn{background:#fff;color:#1E1A44;margin-top:4px}
.himg{width:128px;height:128px;border-radius:50%;background:#fff;flex:0 0 auto;overflow:hidden;display:grid;place-items:center}
.himg img{width:100%;height:100%;object-fit:contain}
.dots2{display:flex;gap:6px;justify-content:center;margin-top:8px}.dots2 i{width:7px;height:7px;border-radius:4px;background:var(--line)}.dots2 i.on{width:20px;background:var(--pri)}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cat{border:0;background:transparent;display:flex;flex-direction:column;gap:6px;align-items:center;padding:0;min-width:0;color:var(--ink)}
.cat .tile{width:100%;aspect-ratio:1/1;border-radius:18px;display:block}.cat b{font-size:13px}
.flash{background:linear-gradient(160deg,var(--tint),var(--panel));border:1px solid var(--line);border-radius:18px;padding:14px}
.flashhd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cd{background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700}
.fcard{flex:0 0 150px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stockbar{height:6px;border-radius:3px;background:var(--line);margin:6px 0 2px;overflow:hidden}.stockbar i{display:block;height:100%;background:var(--acc)}
.mini{position:absolute;left:12px;right:12px;bottom:78px;z-index:8;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px #0b1b3345}
.mini .btn{background:var(--acc);color:var(--acc-ink)}.mini .bar2{background:#ffffff33;height:6px;border-radius:3px;overflow:hidden}.mini .bar2 i{display:block;height:100%;background:var(--acc)}
.fab.up{bottom:150px}.app .toast{bottom:150px}
@container app (min-width:640px){.hslide{flex-basis:calc(50% - 5px)}.cats{grid-template-columns:repeat(6,minmax(0,1fr))}}
@container app (min-width:960px){.hslide{flex-basis:calc(33.33% - 7px)}.mini{left:auto;right:24px;bottom:24px;width:380px}.fab.up{bottom:100px}.app .toast{bottom:100px}}

.paybox{display:flex;flex-direction:column;gap:2px;background:var(--tint);border-radius:12px;padding:12px;margin:2px 0 12px;font-size:13px}
.paybox small{color:var(--muted);font-size:12.5px}
.paym{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}.paym small{color:var(--muted);font-size:12.5px}
.phead{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.av{width:60px;height:60px;border-radius:50%;background:var(--pri);color:var(--pri-ink,#fff);display:grid;place-items:center;font-size:22px;font-weight:900;flex:0 0 auto}
.phead .who{flex:1 1 160px;min-width:0;display:grid;gap:4px}.phead .who b{font-size:18px;overflow-wrap:anywhere}.phead .who small{color:var(--muted);font-size:12.5px}
.badges{display:flex;flex-wrap:wrap;gap:6px}.tag.pts{background:var(--tint);color:var(--ink)}
.grp{margin-top:18px}.grpT{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 4px 6px;font-weight:700}
.lst{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;min-width:0}
.lst>.li:last-child,.lst>.lnote:last-child{border-bottom:0}
button.li{cursor:pointer;touch-action:manipulation}button.li:hover{background:var(--tint)}
.li .ic{width:36px;height:36px;border-radius:10px;background:var(--tint);color:var(--pri);display:grid;place-items:center;flex:0 0 auto}
.li .tx{flex:1 1 0;min-width:0;display:grid;gap:1px}.li .tx b{font-size:14px;font-weight:700;overflow-wrap:anywhere}.li .tx small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.li .chv{color:var(--muted);display:grid;flex:0 0 auto}.li.wrap{flex-wrap:wrap}.li.bad,.li.bad .ic{color:var(--bad)}.li.bad .ic{background:transparent}
.dotn{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:0 0 auto}
.lnote{display:block;padding:8px 14px;color:var(--muted);font-size:12px}

const IDS={party:['tub','cone','stik'],best:['stik','cone','yog'],choco:['stik','milk'],fresh:['yog','yogs','mangga'],nugget:['naget'],promo:['tub','cone','yog']};
function botReply(q){
  const s=q.toLowerCase(), B=BOT[S.lang]||BOT.id, hit=(INTENTS.find(([k,w])=>w.some(x=>s.includes(x)))||[])[0];
  if(!hit) return {text:B.fallback,ids:[]};
  if(hit==='points'){if(!S.user)return{text:B.guest,ids:[]};const P=pts(),ti=myTier(),nx=TIERS[ti+1];return{text:B.points(P,T('tier_'+TIERS[ti].k),nx?nx.min-P.life:0,nx?T('tier_'+nx.k):''),ids:[]}}
  if(hit==='order'){if(!S.user)return{text:B.guest,ids:[]};const m=S.orders.find(o=>o.mine);return{text:m?B.order(m,T('s_'+m.status)):B.noOrder,ids:[]}}
  return {text:B[hit],ids:IDS[hit]||[]};
}
const msgHTML=m=>{
  if(m.typing)return `<div class="msg bot dots" aria-label="..."><span></span><span></span><span></span></div>`;
  if(m.from==='me')return `<div class="msg me">${m.text.replace(/</g,'&lt;')}</div>`;
  const txt=m.k==='hello'?T('botHello'):m.text;
  return `<div class="msg bot">${txt}${(m.ids||[]).length?`<div class="rail">${m.ids.map(id=>{const p=PRODUCTS.find(x=>x.id===id);return `<button class="rec" data-open="${id}">${tile(p)}<div><b>${p.name}</b><span class="num">${rp(unit(p))} &middot; ${p.size}</span></div></button>`}).join('')}</div>`:''}</div>`};
function chatView(){return `<div class="chat" role="dialog" aria-modal="true" tabindex="-1" aria-label="${T('botAsk')}"><div class="chat-top"><button class="chat-back" data-chatclose aria-label="${T('close')}">&larr;</button>
  <div><b translate="no">Tanya AI</b><small>${T('botNote')}</small></div><span class="chipy">${T('sample')}</span></div>
  <div class="chat-msgs" id="chat-msgs" aria-live="polite">${S.chat.msgs.map(msgHTML).join('')}</div>
  <div class="chat-chips">${(BOT[S.lang]||BOT.id).chips.map(c=>`<button data-ask="${c.replace(/"/g,'&quot;')}">${c}</button>`).join('')}</div>
  <form class="chat-form" id="chat-form"><label class="sr" for="chat-in">${T('botPh')}</label><input id="chat-in" name="message" autocomplete="off" placeholder="${T('botPh')}…"><button class="btn" type="submit">${T('botSend')}</button></form></div>`}
function renderChat(){const el=$('#chat-msgs');if(el){el.innerHTML=S.chat.msgs.map(msgHTML).join('');el.scrollTop=el.scrollHeight}}
function ask(q){q=(q||'').trim();if(!q)return;S.chat.msgs.push({from:'me',text:q},{from:'bot',typing:true});renderChat();
  setTimeout(()=>{S.chat.msgs=S.chat.msgs.filter(m=>!m.typing);const r=botReply(q);S.chat.msgs.push({from:'bot',text:r.text,ids:r.ids});renderChat()},550)}

const ic=(n,s=20)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICP[n]}</svg>`;
function qrSvg(){let s=7,c='';const N=25;const fin=(x,y)=>(x<7&&y<7)||(x>=N-7&&y<7)||(x<7&&y>=N-7);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){let on;if(fin(x,y)){const ax=x<7?x:x-(N-7),ay=y<7?y:y-(N-7);on=(ax===0||ax===6||ay===0||ay===6)||(ax>=2&&ax<=4&&ay>=2&&ay<=4)}else{s=(s*1103515245+12345)&0x7fffffff;on=(s>>8)%2===0}
    if(on)c+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  return `<svg role="img" aria-label="${T('qrisNote')}" viewBox="-1 -1 ${N+2} ${N+2}" width="132" height="132" style="background:#fff;border-radius:8px;flex:0 0 auto"><g fill="#1E1A44">${c}</g></svg>`}
function payDetail(m){
  if(m==='bank') return `<div class="paybox"><b>${T('bankName')}</b><div class="num" style="font-size:20px;font-weight:900;letter-spacing:.5px">000 1234 5678</div><small>${T('bankHolder')}</small><small>${T('bankHow')}</small></div>`;
  if(m==='qris') return `<div class="paybox" style="flex-direction:row;align-items:center;gap:12px">${qrSvg()}<small>${T('qrisNote')}</small></div>`;
  return `<div class="paybox"><small>${T(m==='cod'?'codNote':'walletNote')}</small></div>`;
}
const earnTxt=o=>o.credited?T('pts_earnDone'):(o.pay==='cod'?T('pts_earnCod'):T('pts_earnWait'));
function payBlock(o){
  const m=o.pay||'bank';
  return `<div class="paym"><span class="tag">${T('pay_'+m)}</span>${m==='bank'&&o.status==='pend'?(o.paid?`<small class="num" style="color:var(--good);font-weight:700">${T('paidSent')}</small>`:`<button class="btn small" data-paid="${o.id}">${T('iPaid')}</button>`):''}${m==='cod'&&o.status!=='done'?`<small>${T('codTag')}</small>`:''}</div>`;
}
const tierTag=()=>`<span class="tag member">${T('tier_'+TIERS[myTier()].k)} &middot; ${pts().bal} ${T('points')}</span>`;
const cartCount = () => Object.values(S.cart).reduce((a,b)=>a+b,0);
function lineTotal(p,q){const base=unit(p);let d=0;p.tiers.forEach(([n,pc])=>{if(q>=n)d=pc});return Math.round(base*q*(1-d/100))}
function cartSubtotal(){return Object.entries(S.cart).reduce((a,[id,q])=>a+lineTotal(PRODUCTS.find(p=>p.id===id),q),0)}
function coldTag(p){return `<span class="tag cold">${p.cold==='f'?T('cold_f'):T('cold_c')}</span>`}
const statusSteps=['pend','prep','ship','done'];

/* ---------- consumer ---------- */
function card(p){
  const low = p.stock <= p.reorder;
  return `<div class="card"><button class="tile-btn" data-open="${p.id}" style="all:unset;cursor:pointer;display:block" aria-label="${p.name}">
    <div class="tile" style="background:var(${p.tile});aspect-ratio:1/1;border-radius:0">${dealPct(p)?`<span class="ribbon">-${dealPct(p)}%</span>`:p.best?`<span class="ribbon">${T('best')}</span>`:p.isNew?`<span class="ribbon">${T('newc')}</span>`:''}<img width="400" height="400" loading="lazy" decoding="async" alt="" src="${IMG[p.img]}"></div></button>
   <div class="body"><div class="nm">${p.name}</div><div class="sz">${p.size}</div>
    <div class="tags">${coldTag(p)}${p.expiring?`<span class="tag exp">${T('exp')}</span>`:''}${low?`<span class="tag low">${T('stock')} ${p.stock}</span>`:''}</div>
    ${isGold()?`<div class="tags"><span class="tag member">${T('vip')}</span></div>`:`<div class="tags"><span class="tag member">${T('memberHint')}</span></div>`}
    <div class="row"><div><span class="price num">${rp(unit(p))}</span>${(isGold()||dealPct(p))?`<span class="old num">${rp(p.price)}</span>`:''}${unit(p)>=1000?`<span class="tag" style="display:block;margin-top:2px;color:var(--good);background:var(--good-bg)">+${Math.floor(unit(p)/EARN_RP)} ${T('plusPts')}</span>`:''}</div>
    <button class="add" data-add="${p.id}" aria-label="${T('add')} ${p.name}">+</button></div></div></div>`;
}
function heroHome(){

   <div class="dots2" id="hdots">${sl.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div></section>`;
}
function catTiles(){

   <div class="rail">${ids.map(id=>{const p=PRODUCTS.find(x=>x.id===id),sold=[72,58,81][ids.indexOf(id)];return `<div class="fcard"><button data-open="${id}" style="all:unset;cursor:pointer;display:block"><div class="tile" style="background:var(${p.tile});aspect-ratio:1/1"><span class="ribbon">-${DEAL[id]}%</span><img width="400" height="400" loading="lazy" decoding="async" alt="${p.name}" src="${IMG[p.img]}"></div></button>

function reorderHome(){

function fmtHMS(ms){const s=Math.max(0,Math.round(ms/1000));return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

  const n=cartCount(); if(!n||S.tab!=='home'||S.chat.open||S.scr) return '';

function cartView(){

function pointsPanel(){

  if(S.aTab==='over') return `<div class="kpis">${adminOverview()}</div>

      ${Object.entries(S.pts).map(([n,P])=>`<div class="kv"><span>${n}<small style="display:block;color:var(--muted)">${T('tier_'+TIERS[tierIdx(P.life)].k)}</small></span><b class="num">${P.bal.toLocaleString('id-ID')} ${T('points')}</b></div>`).join('')}</div>
     <div class="panel"><h3>${T('sales7')}</h3><p class="num">Rp ribu</p>${spark()}</div></div></div>`;
  const tbl=(cols,rows)=>`<div class="panel"><p>${T('lightNote')}</p><div class="tablewrap"><table class="light"><tr>${cols.map(c=>`<th>${T(c)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td class="num">${c}</td>`).join('')}</tr>`).join('')}</table></div></div>`;
  switch(S.aTab){
   case 'ord': return tbl(['colOrder','colClient','colAmt','colStatus'],S.orders.map(o=>[o.id,o.client,rp(o.total),`<span class="pill ${o.status}">${T('s_'+o.status)}</span>`]));
   case 'del': {const r=S.orders.filter(o=>o.status==='prep'||o.status==='ship').map((o,i)=>[o.id,['Budi','Rina'][i%2]+' ('+T('sample')+')','12 min',`<span class="pill ${o.status}">${T('s_'+o.status)}</span>`]);return tbl(['colTask','colCourier','colEta','colStatus'],r.length?r:[['-','-','-','-']]);}
   case 'stock': return tbl(['colItem','colStock','colRe'],PRODUCTS.map(p=>[p.name+' '+p.size,`<span style="color:${p.stock<=p.reorder?'var(--bad)':'inherit'};font-weight:${p.stock<=p.reorder?700:400}">${p.stock}</span>`,p.reorder]));
   case 'funds': return tbl(['colDate','colType','colAmt'],[['25 Nov',T('inc'),rp(1250000)],['24 Nov',T('expn'),rp(840000)],['23 Nov',T('inc'),rp(990000)],['22 Nov',T('expn'),rp(2100000)]]);
   case 'alarm': return tbl(['colType','colItem'],[['P0',T('cold0')]].concat(d.low.map(p=>['P1',p.name+' '+p.size])));
   case 'ana': return tbl(['colItem','colAmt'],[['Stik Cokelat Almond',rp(1470000)],['Cone Vanila Susu',rp(1180000)],['Yogurt Original',rp(960000)],['Naget Ayam',rp(780000)]]);
   default: return tbl(['colRole','colSetting','colVal'],[['Admin','Konfirmasi transfer','On'],['Admin','Reset data demo','On'],['Kurir','Lihat tugas antar','On']]);

}
function admin(){
  const tabs=[['over','n_over'],['ord','n_ord'],['del','n_del'],['stock','n_stock'],['funds','n_funds'],['alarm','n_alarm'],['ana','n_ana'],['set','n_set']];
  return `<div class="adm"><aside class="side"><div class="brand">Aice Demo &middot; ${T('admin')}</div>${tabs.map(([k,l])=>`<button data-atab="${k}" ${S.aTab===k?'aria-current="page"':''}>${T(l)}</button>`).join('')}</aside>
   <div class="content"><nav class="pillnav" aria-label="Admin">${tabs.map(([k,l])=>`<button data-atab="${k}" ${S.aTab===k?'aria-current="page"':''}>${T(l)}</button>`).join('')}</nav>
   <div class="scroll"><div class="body"><div class="ahero"><div><h2>${T('a_title')}</h2><p>${T('a_sub')}</p></div>
    <div class="ctl"><button class="btn small" data-toconsumer>${T('a_open')} &#8599;</button><select aria-label="${T('language')}" id="alang">${['id','en','zh'].map(l=>`<option value="${l}" ${S.lang===l?'selected':''}>${{id:'Indonesia',en:'English',zh:'中文'}[l]}</option>`).join('')}</select>

/* ---------- render + events ---------- */
function seg(el,items,cur,attr){el.innerHTML=items.map(([k,l])=>`<button ${attr}="${k}" aria-pressed="${cur===k}">${l}</button>`).join('')}
function render(){
  document.documentElement.lang=S.lang==='zh'?'zh':S.lang;
  const sc=$('#scroll'), top=sc?sc.scrollTop:0, ss=document.querySelector('.adm .scroll'), atop=ss?ss.scrollTop:0;
  seg($('#seg-role'),[['consumer',T('consumer')],['admin',T('admin')]],S.role,'data-role');
  seg($('#seg-dev'),[['phone',T('phone')],['tablet',T('tablet')],['laptop',T('laptop')]],S.dev,'data-dev');
  seg($('#seg-theme'),[['light',T('light')],['dark',T('dark')]],S.theme,'data-theme');
  document.documentElement.setAttribute('data-theme',S.theme);
  seg($('#seg-lang'),[['id','ID'],['en','EN'],['zh','中文']],S.lang,'data-lang');
  document.querySelectorAll('[data-p]').forEach(e=>e.textContent=T(e.dataset.p));
  const w=S.role==='admin'?{phone:390,tablet:820,laptop:1280}[S.dev]:{phone:390,tablet:820,laptop:1280}[S.dev];
  const f=$('#frame'); f.style.setProperty('--w',w+'px'); f.classList.toggle('wide',S.dev!=='phone');
  f.innerHTML=S.role==='admin'?admin():consumer();
  $('#topnote').textContent=S.role==='admin'
   ? (S.lang==='id'?'Admin dirancang untuk laptop dulu (menu samping, tabel, kartu KPI). Di ponsel menu berubah jadi pil dan kartu bertumpuk. Coba “Konfirmasi transfer”, lalu buka Konsumen > Pesanan.':S.lang==='en'?'Admin is laptop-first (side menu, tables, KPI cards). On a phone the menu becomes pills and cards stack. Try “Confirm transfer”, then open Consumer > Orders.':'管理端以笔记本为主（侧边菜单、表格、KPI 卡片）。手机上菜单变为胶囊，卡片堆叠。试试“确认转账”，再打开消费者 > 订单。')
   : (S.lang==='id'?'Konsumen dirancang untuk ponsel dulu: navigasi bawah, jempol-friendly. Di tablet dan laptop, menu pindah ke samping dan grid produk jadi 3 sampai 4 kolom. Buat pesanan dengan transfer bank, lalu lihat di Admin.':S.lang==='en'?'Consumer is phone-first: bottom nav, thumb-friendly. On tablet and laptop the menu moves to the side and the product grid grows to 3 to 4 columns. Place an order by bank transfer, then see it in Admin.':'消费者端以手机为主：底部导航，单手易用。平板和笔记本上菜单移到侧边，商品网格增至 3 到 4 列。用银行转账下单，然后在管理端查看。');
  const fk=JSON.stringify([S.confirm,S.sheet,S.scr&&S.scr.k,S.chat.open]);
  if(fk!==S._fk){S._fk=fk;const d=document.querySelector('.dlg,.sheet,.screen,.chat');if(d)d.focus({preventScroll:true})}
  syncHash();
  const sc2=$('#scroll'); if(sc2) sc2.scrollTop=top; const ss2=document.querySelector('.adm .scroll'); if(ss2) ss2.scrollTop=atop;
}
function toast(msg,tab){S.toast=msg;S.toastTab=tab;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast=null;render()},3200)}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-scrim]'); if(!t) return;
  const D=t.dataset;
  if(D.scrim!==undefined&&e.target===t){S.sheet=null;return render()}
  if(D.hero){if(D.hero==='cone'){S.cat='cone';render();const s=$('#shelf');if(s)s.scrollIntoView({behavior:'smooth'});return}S.tab=D.hero;S._rep=false;return render()}
  if(D.catgo){S.cat=D.catgo;render();const s=$('#shelf');if(s)s.scrollIntoView({behavior:'smooth'});return}
  if(D.dlg){S.confirm=D.dlg;return render()}
  if(D.cancel!==undefined){S.confirm=null;return render()}
  if(D.dlgscrim!==undefined){if(e.target===t){S.confirm=null;render()}return}
  if(D.yes){const y=D.yes;S.confirm=null;if(y==='signout'){S.user=null;S.redeem=false}else if(y==='reset'){const k={role:S.role,dev:S.dev,lang:S.lang,theme:S.theme};S=Object.assign(fresh(),k)}return render()}
  if(D.scr){S.scr={k:D.scr,id:D.id};S.chat.open=false;if(D.scr==='report')S.rp={reason:'melt',res:'replace',photo:false,note:''};return render()}
  if(D.back!==undefined){if(S.scr&&S.scr.k==='report')S.scr={k:'order',id:S.scr.id};else S.scr=null;return render()}
  if(D.q!==undefined){S.q=D.q;return render()}
  if(D.clearq!==undefined){S.q='';return render()}
  if(D.notifread!==undefined){S.notifRead=true;return render()}
  if(D.addr!==undefined){S.addr=+D.addr;return render()}
  if(D.store!==undefined){if(STORES[+D.store].open){S.store=+D.store;return render()}return}
  if(D.rp){const [g,v]=D.rp.split(':');S.rp[g]=g==='photo'?v==='true':v;return render()}
  if(D.sendreport){const o=S.orders.find(x=>x.id===D.sendreport);if(o){o.report={reason:S.rp.reason,res:S.rp.res,step:0,note:S.rp.note};S.scr={k:'order',id:o.id};render();setTimeout(()=>{o.report.step=1;render()},2500)}return}
  if(D.adv){const o=S.orders.find(x=>x.id===D.adv);if(o){if(o.status==='prep'){o.status='ship';o.eta=Date.now()+12*60000}else if(o.status==='ship'){o.status='done';if(o.pay==='cod')creditOrder(o)}}return render()}
  if(D.role){S.role=D.role;if(D.role==='admin'&&S.dev==='phone'&&false)S.dev='laptop';return render()}
  if(D.dev){S.dev=D.dev;return render()}
  if(D.lang){S.lang=D.lang;return render()}
  if(D.tab){S._rep=S.tab!=='home'&&D.tab!=='home';S.tab=D.tab;S.toast=null;S.scr=null;S.chat.open=false;return render()}
  if(D.cat){S.cat=D.cat;return render()}
  if(D.open){S.product=D.open;S.sheet='product';return render()}
  if(D.close!==undefined){S.sheet=null;return render()}
  if(D.add){S.cart[D.add]=(S.cart[D.add]||0)+1;return toast(PRODUCTS.find(p=>p.id===D.add).name+' +1','cart')}
  if(D.bundle){const b=BUNDLES.find(x=>x.id===D.bundle);S.cart.stik=(S.cart.stik||0)+6;return toast(b.name,'cart')}
  if(D.inc){S.cart[D.inc]=(S.cart[D.inc]||0)+1;return render()}
  if(D.dec){const q=(S.cart[D.dec]||0)-1;if(q<=0)delete S.cart[D.dec];else S.cart[D.dec]=q;return render()}
  if(D.slot){S.slot=+D.slot;return render()}
  if(D.pay){S.pay=D.pay;return render()}
  if(D.paydef){S.payDef=D.paydef;S.pay=D.paydef;return render()}
  if(D.paid){const o=S.orders.find(x=>x.id===D.paid);if(o)o.paid=true;return render()}
  if(D.voucher!==undefined){S.voucher=!S.voucher;return render()}
  if(D.place){
    if(!S.user){S.sheet='sign';return render()}
    const items=Object.entries(S.cart).map(([id,q])=>PRODUCTS.find(p=>p.id===id).name+' x'+q).join(', ');
    const X=totals();S.seq++;const o={id:'ORD-20261125-'+S.seq,client:S.user.name,items,total:X.tot,earn:X.earn,status:S.pay==='bank'?'pend':'prep',eta:S.pay==='bank'?0:Date.now()+14*60000,mine:true,pay:S.pay,paid:false};
    if(X.rPts){pts().bal-=X.rPts;pts().hist.unshift({d:'25 Nov',k:'redeem',t:o.id,p:-X.rPts})}
    S.orders.unshift(o);if(o.status==='prep'&&o.pay!=='cod')creditOrder(o);S.redeem=false;S.pay=S.payDef;
    S.cart={};S.tab='orders';return toast(T('placed'),'orders');
  }
  if(D.chat!==undefined){S.chat.open=true;S.role='consumer';return render()}
  if(D.chatclose!==undefined){S.chat.open=false;return render()}
  if(D.ask!==undefined){return ask(D.ask)}
  if(D.redeem!==undefined){S.redeem=!S.redeem;return render()}
  if(D.theme){S.theme=D.theme;return render()}
  if(D.sign!==undefined){S.sheet='sign';return render()}
  if(D.stab){S.signTab=D.stab;return render()}
  if(D.acc!==undefined){const a=ACCOUNTS[+D.acc];const ph=$('#f-phone');if(ph)ph.value=a.phone.replace(/-/g,' ');S._pick=a;return}
  if(D.dologin!==undefined){const nm=$('#f-name');const a=S._pick||(nm&&nm.value?{name:nm.value,phone:($('#f-phone').value||'812 0000 0000'),vip:false}:ACCOUNTS[0]);S.user=a;if(!S.pts[a.name])S.pts[a.name]={bal:100,life:100,hist:[{d:'25 Nov',k:'bonus',t:'',p:100}]};S.sheet=null;S._pick=null;return render()}
  if(D.signout!==undefined){S.user=null;return render()}
  if(D.noop!==undefined){return}
  if(D.atab){S.aTab=D.atab;return render()}
  if(D.confirm){const o=S.orders.find(x=>x.id===D.confirm);if(o){o.status='prep';o.eta=Date.now()+14*60000;creditOrder(o)}return render()}
  if(D.reset!==undefined){const k={role:S.role,dev:S.dev,lang:S.lang,theme:S.theme};S=Object.assign(fresh(),k);return render()}
  if(D.toconsumer!==undefined){S.role='consumer';S.tab='orders';return render()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const r=$('#sr');if(r)r.innerHTML=searchRes()}if(e.target.id==='rp-note')S.rp.note=e.target.value});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(S.confirm)S.confirm=null;else if(S.sheet)S.sheet=null;else if(S.scr)S.scr=(S.scr.k==='report'?{k:'order',id:S.scr.id}:null);else if(S.chat.open)S.chat.open=false;else return;render()});
const TABS=['home','cart','orders','profile'],ATABS=['over','ord','del','stock','funds','alarm','ana','set'];
function syncHash(){const h=S.role==='admin'?'admin-'+S.aTab:'app-'+S.tab;if(location.hash.slice(1)!==h){try{if(S._rep)history.replaceState(null,'','#'+h);else location.hash=h}catch(e){}}S._rep=false}
function readHash(){const h=location.hash.slice(1);if(h.startsWith('admin-')&&ATABS.includes(h.slice(6))){S.role='admin';S.aTab=h.slice(6);return true}if(h.startsWith('app-')&&TABS.includes(h.slice(4))){S.role='consumer';S.tab=h.slice(4);return true}return false}
window.addEventListener('hashchange',()=>{if(readHash()){S.scr=null;S.sheet=null;S.chat.open=false;render()}});
setInterval(()=>{const l=S.flashEnd-Date.now();document.querySelectorAll('[data-cd]').forEach(el=>{el.textContent=fmtHMS(l)});if(l<=0&&!S._flashDone){S._flashDone=true;render()}},1000);
const rm=matchMedia('(prefers-reduced-motion:reduce)');
setInterval(()=>{const h=$('#hero');if(!h||rm.matches||h.scrollWidth<=h.clientWidth+4||S._heroHold)return;const w=h.firstElementChild.getBoundingClientRect().width+10;const i=Math.round(h.scrollLeft/w);h.scrollTo({left:((i+1)%3)*w,behavior:'smooth'})},4500);
document.addEventListener('scroll',e=>{if(e.target&&e.target.id==='hero'){const h=e.target,w=h.firstElementChild.getBoundingClientRect().width+10,i=Math.round(h.scrollLeft/w);document.querySelectorAll('#hdots i').forEach((d,k)=>d.classList.toggle('on',k===i))}},true);
document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('#hero')){S._heroHold=true;setTimeout(()=>S._heroHold=false,9000)}});
setInterval(()=>{document.querySelectorAll('[data-eta]').forEach(el=>{el.textContent=fmtEta(+el.dataset.eta-Date.now())})},1000);
document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();const i=$('#chat-in');ask(i.value);i.value=''}});
document.addEventListener('change',e=>{if(e.target.id==='alang'){S.lang=e.target.value;render()}});
readHash();render();
</script>
