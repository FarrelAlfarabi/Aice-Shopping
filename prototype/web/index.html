<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Demo konsep. Bukan aplikasi resmi Aice.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Aice Shopping">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B5FD8">
  <!-- Start the slow downloads as early as possible. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="assets/assets/products/cone-vanila.webp" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/products/stik-cokelat.webp" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/products/tub-stroberi.webp" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/products/bundle-keluarga.webp" as="fetch" crossorigin>
  <style>
    html, body { margin: 0; height: 100%; background: #DCE5F2; }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      max-width: 430px; margin: 0 auto; background: #F4F8FF;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0B1B33;
      transition: opacity .35s ease;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    .ice { width: 64px; height: 96px; position: relative; animation: bob 1.4s ease-in-out infinite; }
    .ice .scoop { position: absolute; left: 4px; top: 0; width: 56px; height: 52px; border-radius: 50% 50% 44% 44%;
      background: linear-gradient(135deg, #4A93FF, #0B5FD8); }
    .ice .cone { position: absolute; left: 10px; top: 40px; width: 0; height: 0;
      border-left: 22px solid transparent; border-right: 22px solid transparent; border-top: 56px solid #FFC93C; }
    .ttl { margin-top: 18px; font-size: 20px; font-weight: 800; }
    .bar { margin-top: 18px; width: 140px; height: 5px; border-radius: 99px; background: #D9E3F2; overflow: hidden; }
    .bar i { display: block; width: 40%; height: 100%; border-radius: 99px; background: #0B5FD8;
      animation: load 1.1s ease-in-out infinite; }
    .foot { position: absolute; bottom: 24px; font-size: 12px; color: #55627A; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { .ice, .bar i { animation: none; } }
  </style>
  <title>Aice Shopping (demo)</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Shows at once, while Flutter downloads. Removed on Flutter's first frame. -->
  <div id="splash" role="status" aria-label="Memuat">
    <div class="ice"><div class="cone"></div><div class="scoop"></div></div>
    <div class="ttl">Es krim, tetap beku.</div>
    <div class="bar"><i></i></div>
    <div class="foot">Demo konsep. Bukan aplikasi resmi Aice.</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
